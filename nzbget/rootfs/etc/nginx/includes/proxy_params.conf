proxy_http_version          1.1;
proxy_ignore_client_abort   off;
proxy_read_timeout          86400s;
proxy_send_timeout          86400s;
proxy_max_temp_file_size    0;

# The queue and the message log are polled continuously, and an nzb file goes
# the other way as a single upload, so nothing gains from being collected on
# disk before it is passed on.
proxy_buffering             off;

# NZBGet answers relative to the request it was given and never sends a
# redirect, so there is nothing for NGINX to rewrite on the way back.
proxy_redirect              off;

proxy_set_header Connection $connection_upgrade;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Host $host;

# Deliberately no X-Forwarded-For or X-Real-IP. NZBGet is told to let clients
# on loopback through without a login, which is how the Ingress panel opens
# without one, and it decides that from the address the connection came from.
# Nothing here should suggest that a header could be a substitute for it.
